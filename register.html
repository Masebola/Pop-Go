<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — Pop &amp; Go</title>
  <meta name="description" content="Create a Pop & Go account. Placeholder registration — Supabase Auth integration is planned." />
  <meta name="theme-color" content="#d1352b" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <nav class="nav" aria-label="Main navigation">
        <a class="brand" href="index.html"><span class="logo-mark">P</span>Pop<span class="brand-go">&amp;Go</span></a>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="products.html">Products</a></li>
          <li><a href="pricing.html">Pricing</a></li>
          <li><a href="faq.html">FAQ</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
        <div class="nav-actions">
          <a href="login.html" class="btn btn-ghost btn-sm">Login</a>
          <a href="products.html" class="btn btn-primary btn-sm">Order Now</a>
          <button class="nav-toggle" aria-label="Toggle menu"><span data-icon="menu"></span></button>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <div class="auth-wrap">
      <div class="auth-card">
        <h1>Create your account</h1>
        <p class="sub">Join Pop &amp; Go to manage the business</p>

        <div class="placeholder-note">
          Placeholder registration — no real account is created. Supabase Auth is planned for a future version.
        </div>

        <form id="register-form" novalidate>
          <div class="form-row">
            <div class="field">
              <label for="fname">First name</label>
              <input type="text" id="fname" name="fname" required placeholder="Thabo" />
            </div>
            <div class="field">
              <label for="lname">Last name</label>
              <input type="text" id="lname" name="lname" required placeholder="Mudau" />
            </div>
          </div>
          <div class="field">
            <label for="r-email">Email address</label>
            <input type="email" id="r-email" name="email" required placeholder="you@univen.ac.za" />
          </div>
          <div class="field">
            <label for="r-password">Password</label>
            <input type="password" id="r-password" name="password" required minlength="6" placeholder="At least 6 characters" />
          </div>
          <div class="field">
            <label for="r-confirm">Confirm password</label>
            <input type="password" id="r-confirm" name="confirm" required minlength="6" placeholder="Re-enter password" />
          </div>
          <button type="submit" class="btn btn-primary btn-block">Create account</button>
          <div class="form-msg" id="r-error" style="background:rgba(192,57,43,0.12);color:var(--bad);"></div>
        </form>

        <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
      </div>
    </div>
  </main>

  <script src="/assets/js/store.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script>
    (function () {
      var form = document.getElementById("register-form");
      var err = document.getElementById("r-error");
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        err.classList.remove("show");
        if (!form.checkValidity()) { form.reportValidity(); return; }
        var pw = document.getElementById("r-password").value;
        var confirm = document.getElementById("r-confirm").value;
        if (pw !== confirm) {
          err.textContent = "Passwords do not match. Please try again.";
          err.classList.add("show");
          return;
        }
        var email = document.getElementById("r-email").value.trim();
        PGStore.login(email);
        PGUI.toast("Account created — redirecting to dashboard");
        setTimeout(function () { location.href = "admin/index.html"; }, 800);
      });
    })();
  </script>
</body>
</html>
